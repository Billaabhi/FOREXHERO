name: FX Brain CI

on:
  push:
    branches: [fx-brain-v1]
  pull_request:
    branches: [main, fx-brain-v1]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . pytest
      - run: pytest -q
